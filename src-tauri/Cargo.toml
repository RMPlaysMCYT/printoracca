[package]
name = "printoracca"
version = "0.1.0"
description = "Your Printing Kiosk Partner"
authors = ["Ronnel Mitra"]
edition = "2021"

[lib]
name = "printoracca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusb = "0.9"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "fileapi",
    "winbase",
    "winerror",
    "winnt",
    "minwinbase",
    "minwindef",
    "handleapi",
    "errhandlingapi"
] }